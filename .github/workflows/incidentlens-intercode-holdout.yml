name: IncidentLens InterCode Holdout

on:
  push:
    branches: [incidentlens-zero-cost-bench]
    paths:
      - '.github/workflows/incidentlens-intercode-holdout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intercode-reverse-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Verify free runner
        run: |
          set -euxo pipefail
          docker --version
          docker info --format '{{json .ServerVersion}}'

      - name: Fetch pinned professional baseline
        run: |
          set -euxo pipefail
          mkdir -p /tmp/human
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/lyptus-research/cyber-task-horizons-data/178c0da1800f9c07311e1b8d6c61dd8104e7b4ae/data/human/completions.csv \
            -o /tmp/human/completions.csv
          sha256sum /tmp/human/completions.csv

      - name: Fetch pinned repaired InterCode suite
        run: |
          set -euxo pipefail
          git init /tmp/Cyber-Zero
          cd /tmp/Cyber-Zero
          git remote add origin https://github.com/amazon-science/Cyber-Zero.git
          git fetch --depth 1 origin e0c4493ac27dd3a8c96e524c3966c3927261c625
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = e0c4493ac27dd3a8c96e524c3966c3927261c625
          test -d benchmarks/intercode_ctf/rev

      - name: Build offline analysis tool image
        run: |
          set -euxo pipefail
          mkdir -p /tmp/il-image
          cat >/tmp/il-image/Dockerfile <<'EOF'
          FROM ubuntu:24.04
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              bash coreutils findutils grep sed gawk file binutils gdb python3 xxd gcc g++ libc6-dev ca-certificates \
              && rm -rf /var/lib/apt/lists/*
          CMD ["sleep","3600"]
          EOF
          docker build -t incidentlens-ctf-tools:freeze1 /tmp/il-image

      - name: Install local inference runtime
        run: |
          set -euxo pipefail
          curl -LsSf https://llama.app/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/llama" --version

      - name: Start frozen local model
        run: |
          set -euxo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          nohup llama serve \
            -hf Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF:Q4_K_M \
            --host 127.0.0.1 --port 8080 -c 4096 -np 1 \
            > /tmp/intercode-model.log 2>&1 &
          PID=$!
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$PID" 2>/dev/null; then tail -150 /tmp/intercode-model.log; exit 1; fi
            sleep 2
          done
          tail -150 /tmp/intercode-model.log
          exit 1

      - name: Execute frozen same-task holdout
        run: |
          set -euxo pipefail
          mkdir -p intercode_out
          PYTHONPATH=incidentlens_bench python3 incidentlens_bench/intercode_staging_fix.py \
            --bench-root /tmp/Cyber-Zero/benchmarks/intercode_ctf/rev \
            --human-csv /tmp/human/completions.csv \
            --out-dir intercode_out \
            --base-url http://127.0.0.1:8080 \
            --model local-qwen-coder \
            --image incidentlens-ctf-tools:freeze1 \
            --limit 10 \
            --max-actions 12
          cat intercode_out/summary.json

      - name: Record immutable provenance
        if: always()
        run: |
          set +e
          mkdir -p intercode_out
          {
            echo 'protocol=IncidentLens InterCode local repaired holdout v1'
            echo 'human_data_commit=178c0da1800f9c07311e1b8d6c61dd8104e7b4ae'
            echo 'cyber_zero_commit=e0c4493ac27dd3a8c96e524c3966c3927261c625'
            echo 'model=Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF:Q4_K_M'
            echo 'adapter_v2_dev_run=33397361564'
            echo 'prior_infra_failed_run=33421451531'
            echo 'prior_failure=bind-mount staging permission before first model action; no benchmark outcome observed'
            echo "workflow_commit=${GITHUB_SHA}"
            sha256sum incidentlens_bench/intercode_local_holdout.py incidentlens_bench/intercode_staging_fix.py
            docker image inspect incidentlens-ctf-tools:freeze1 --format '{{.Id}}' 2>/dev/null || true
          } > intercode_out/provenance.txt
          tail -150 /tmp/intercode-model.log > intercode_out/model-tail.log 2>/dev/null || true

      - name: Upload frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incidentlens-intercode-human-holdout
          path: intercode_out/
          if-no-files-found: error
          retention-days: 30

      - name: Scope declaration
        if: always()
        run: |
          echo 'Only repaired public CTF challenge files are executed.'
          echo 'Each challenge sandbox has Docker network=none, cap-drop=ALL and no-new-privileges.'
          echo 'No paid API and no arbitrary or external target is used.'
