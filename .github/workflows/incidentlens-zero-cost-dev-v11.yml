name: IncidentLens Zero-Cost DEV v1.1 Scoring Correction

on:
  push:
    branches: [incidentlens-zero-cost-bench]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoring-corrected-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Fetch identical pinned inputs
        run: |
          set -euxo pipefail
          ROOT=/tmp/cyber-task-horizons-data
          mkdir -p "$ROOT/data/human" "$ROOT/data/tasks/nl2bash" "$ROOT/data/tasks/cybashbench"
          BASE=https://raw.githubusercontent.com/lyptus-research/cyber-task-horizons-data/178c0da1800f9c07311e1b8d6c61dd8104e7b4ae
          curl --fail --location --retry 3 "$BASE/data/human/completions.csv" -o "$ROOT/data/human/completions.csv"
          curl --fail --location --retry 3 "$BASE/data/tasks/nl2bash/nl2bash_tasks.jsonl" -o "$ROOT/data/tasks/nl2bash/nl2bash_tasks.jsonl"
          curl --fail --location --retry 3 "$BASE/data/tasks/cybashbench/cybashbench_tasks.jsonl" -o "$ROOT/data/tasks/cybashbench/cybashbench_tasks.jsonl"
      - name: Install identical local runtime
        run: |
          set -euxo pipefail
          curl -LsSf https://llama.app/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Start identical frozen model
        run: |
          set -euxo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          nohup llama serve -hf Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF:Q4_K_M --host 127.0.0.1 --port 8080 -c 2048 -np 1 > /tmp/llama-dev-v11.log 2>&1 &
          PID=$!
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$PID" 2>/dev/null; then tail -200 /tmp/llama-dev-v11.log; exit 1; fi
            sleep 2
          done
          tail -200 /tmp/llama-dev-v11.log; exit 1
      - name: Re-run identical adapter with corrected scorer
        run: |
          set -euxo pipefail
          mkdir -p dev_v11_out
          PYTHONPATH=incidentlens_bench python3 incidentlens_bench/zero_cost_command_dev_v11.py --data-root /tmp/cyber-task-horizons-data --out-dir dev_v11_out --base-url http://127.0.0.1:8080 --limit 60
          cat dev_v11_out/dev_summary.json
      - name: Record correction provenance
        if: always()
        run: |
          set +e
          mkdir -p dev_v11_out
          {
            echo 'behavior_change=NONE'
            echo 'scoring_change=MCQ canonical reference uses bash_command text instead of correct_answer letter'
            echo 'original_dev_run=33396064815'
            echo "workflow_commit=${GITHUB_SHA}"
            sha256sum incidentlens_bench/zero_cost_command_dev.py incidentlens_bench/zero_cost_command_dev_v11.py
          } > dev_v11_out/scoring_correction.txt
      - name: Upload corrected evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incidentlens-zero-cost-grounding-dev-v11
          path: dev_v11_out/
          if-no-files-found: error
          retention-days: 14
