name: AtlasGuard CI

on:
  push:
    paths:
      - "projects/atlasguard/**"
      - ".github/workflows/atlasguard-ci.yml"
  pull_request:
    paths:
      - "projects/atlasguard/**"
      - ".github/workflows/atlasguard-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/atlasguard

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: projects/atlasguard/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest -q --cov=atlasguard --cov-report=term-missing
      - name: Build and verify real controller and Linux agent
        run: python scripts/verify_docker_runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlasguard-runtime-python-${{ matrix.python-version }}
          path: projects/atlasguard/reports/docker-runtime.json
          if-no-files-found: warn
